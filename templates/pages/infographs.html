<script>
document.addEventListener("DOMContentLoaded", function () {
    const tabs = document.querySelectorAll(".tab-btn");
    const resultsContainer = document.getElementById("infographContainer");

    if (!resultsContainer || !tabs.length) return;

    let type = "all";
    let latestRequestId = 0;

    tabs.forEach(tab => {
        tab.addEventListener("click", async function (event) {

            if (event.detail > 1) {
                console.log("نقرة متتابعة رقم:", event.detail);
            }
            
            console.log("Tab clicked:", tab.dataset.type);
            console.log("Event detail:", event.detail);

            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            type = tab.dataset.type;

            // تمييز هذا الطلب عن الطلبات السابقة
            const requestId = ++latestRequestId;
            
            resultsContainer.innerHTML = `
                <p style="text-align:center;font-weight:bold;width:100%;line-height:1.5;">
                    جاري تحميل النتائج...
                </p>
            `;

            try {
                const response = await fetch(
                    `/Infographics/?type=${encodeURIComponent(type)}`,
                    {
                        headers: {
                            "X-Requested-With": "XMLHttpRequest"
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const newdata = await response.json();

                // تجاهل أي استجابة لم تعد تخص آخر تبويب اختاره المستخدم
                if (requestId !== latestRequestId) {
                    return;
                }

                if (typeof window.setInfographicsData !== "function") {
                    throw new Error("setInfographicsData غير متاحة");
                }

                window.setInfographicsData(newdata);

            } catch (error) {
                // لا تعرض خطأ طلب قديم فوق نتائج طلب أحدث
                if (requestId !== latestRequestId) return;

                console.error("حدث خطأ أثناء جلب الإنفوجرافات:", error);

                resultsContainer.textContent =
                    "تعذر تحميل النتائج. يرجى المحاولة مرة أخرى.";
            }
        });
    });
});
</script>
