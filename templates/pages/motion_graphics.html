<!-- تحميل مكتبة YouTube الرسمية -->
<!-- <script src="https://www.youtube.com/iframe_api"></script> -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const tabs = document.querySelectorAll(".tab-btn");
    const resultsContainer = document.getElementById("mationGraphicContainer");
    const loadMoreBtn = document.getElementById('loadMoreBtn')

    if (!resultsContainer || !tabs.length) return;

    let type = "all";
    let latestRequestId = 0;

    tabs.forEach(tab => {
        tab.addEventListener("click", async function (event) {

            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            type = tab.dataset.type;
            
            // تمييز هذا الطلب عن الطلبات السابقة
            const requestId = ++latestRequestId;
            loadMoreBtn.style.display = "none";
            
            resultsContainer.innerHTML = `
                <p style="text-align:center;font-weight:bold;width:100%;line-height:1.5;">
                    جاري تحميل النتائج...
                </p>
            `;

            try {
                const response = await fetch(
                    `/Infographics/MotionGraphics?type=${encodeURIComponent(type)}`,
                    {
                        headers: {
                            "X-Requested-With": "XMLHttpRequest"
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const newdata = await response.json();

                // تجاهل أي استجابة لم تعد تخص آخر تبويب اختاره المستخدم
                if (requestId !== latestRequestId) {
                    return;
                }

                if (typeof window.setmotionData !== "function") {
                    throw new Error("setmotionData غير متاحة");
                }

                window.setmotionData(newdata);

            } catch (error) {
                // لا تعرض خطأ طلب قديم فوق نتائج طلب أحدث
                if (requestId !== latestRequestId) return;

                console.error("حدث خطأ أثناء جلب الموشن:", error);

                resultsContainer.innerHTML =`
                <p style="text-align:center;font-weight:bold;width:100%;line-height:1.5;">
                    تعذر تحميل النتائج. يرجى المحاولة مرة أخرى.</p>
                `;

            }
        });
    });
});
</script>
