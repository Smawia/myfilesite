{% load static %}


{% for item in page.object_list %}
<div class="studies-card infograph-card custom-studies-card">
    <a href="{% url 'infograph_detail' item.slug %}">
        <img src="{% static item.image %}" alt="إنفوجراف" class="infograph-img">
        <div class="study-text-info {% if dark_mode %} dark-mode{% endif %}">
            <span>{{ item.date }}</span>
            <p class="card-title">{{ item.title }}</p>
        </div>
    </a>
</div>
{% endfor %}
{% if not page %}
<p style="text-align: center; font-weight: bold;width: 100%; line-height: 1.5;">لم يتم العثور على نتائج تطابق بحثك ({{query}})</p>
{% endif %}
