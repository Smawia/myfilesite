{% load static %}


<!-- video 1 -->
{% for data in page.object_list %}
<div class="video-card">
    <div class="yt-container" data-id="{{ data.video }}" id="yt-{{ forloop.counter }}">
        <div class="yt-thumb"
            style="background-image:url('https://img.youtube.com/vi/{{ data.video }}/hqdefault.jpg')">
            <div class="yt-play"></div>
        </div>
    </div>
    <a href="https://youtu.be/{{data.video}}" target="_blank">
        <div class="study-text-info study-text-info-2">
            <span>{{ data.date }}</span>
            <p>{{ data.subject }}</p>
        </div>
    </a>
</div>
{% endfor %}
{% if not page %}
    <p style="text-align: center; font-weight: bold;width: 100%; line-height: 1.5;">لم يتم العثور على نتائج تطابق بحثك ({{query}})</p>
{% endif %}
